name: refresh-feeds
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/update_feeds.py
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - run: |
          git config user.name feedbot && git config user.email bot@users.noreply.github.com
          git add data/feeds.json && git commit -m "refresh feeds" || exit 0
          git push
